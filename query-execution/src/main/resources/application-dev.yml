query-execution:
  hetu:
    enabled: false
    calibration:
      profile: REPO_CLOSED_BASELINE
      route-order:
        - JDBC
        - REST
        - CLIENT
      skip-unready-modes: true
    allowed-modes:
      - JDBC
      - REST
      - CLIENT
  routing:
    preferred-engines:
      - HETU
      - HIVE

logging:
  level:
    root: DEBUG
    com.company.queryexecution: DEBUG

auth:
  enabled: false
  trusted-auth-sources:
    - header
