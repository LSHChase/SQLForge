# 配置项 spring：用途：承载 Spring 应用基础配置；默认值：见其子项；运行影响：影响应用名称、激活环境、数据源和自动装配。
spring:
  # 配置项 datasource：用途：配置服务数据库连接；默认值：见其子项；运行影响：影响持久化、查询和任务状态读写。
  datasource:
    # 配置项 driver-class-name：用途：指定 JDBC 驱动类；默认值：com.mysql.cj.jdbc.Driver；运行影响：驱动不匹配会导致数据库连接初始化失败。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 配置项 url：用途：指定数据库或服务访问地址；默认值：环境变量 SQLFORGE_DEV_DB_URL，未设置时为 jdbc:mysql://localhost:3306/sqlforge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true；运行影响：地址错误会导致运行时连接失败。
    url: ${SQLFORGE_DEV_DB_URL:jdbc:mysql://localhost:3306/sqlforge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    # 配置项 username：用途：指定连接账号；默认值：环境变量 SQLFORGE_DEV_DB_USERNAME，未设置时为 sqlforge；运行影响：账号错误会导致认证失败。
    username: ${SQLFORGE_DEV_DB_USERNAME:sqlforge}
    # 配置项 password：用途：指定连接密码或令牌；默认值：环境变量 SQLFORGE_DEV_DB_PASSWORD，未设置时为 sqlforge；运行影响：为空或错误会导致认证失败，生产必须由环境变量注入。
    password: ${SQLFORGE_DEV_DB_PASSWORD:sqlforge}

# 配置项 query-execution：用途：配置查询执行服务或查询执行客户端；默认值：见其子项；运行影响：影响查询路由、Hetu 接入和加速命中。
query-execution:
  # 配置项 hetu：用途：配置 Hetu 引擎接入；默认值：见其子项；运行影响：影响 JDBC、REST、CLIENT 模式是否可参与执行。
  hetu:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：false；运行影响：关闭后上级功能不会进入运行路径。
    enabled: false
    # 配置项 calibration：用途：配置 Hetu 路由校准信息；默认值：见其子项；运行影响：影响不同接入模式的优先级和跳过策略。
    calibration:
      # 配置项 profile：用途：指定校准或运行 profile；默认值：REPO_CLOSED_BASELINE；运行影响：profile 变化会影响运行证据口径和路由策略。
      profile: REPO_CLOSED_BASELINE
      # 配置项 route-order：用途：定义 Hetu 多模式尝试顺序；默认值：见其子项；运行影响：顺序越靠前越优先尝试该接入模式。
      route-order:
        # 配置列表项 列表值：用途：把 Hetu 模式 JDBC 放入路由顺序；默认值：当前列表项为 JDBC；运行影响：顺序越靠前越优先尝试该模式。
        - JDBC
        # 配置列表项 列表值：用途：把 Hetu 模式 REST 放入路由顺序；默认值：当前列表项为 REST；运行影响：顺序越靠前越优先尝试该模式。
        - REST
        # 配置列表项 列表值：用途：把 Hetu 模式 CLIENT 放入路由顺序；默认值：当前列表项为 CLIENT；运行影响：顺序越靠前越优先尝试该模式。
        - CLIENT
      # 配置项 skip-unready-modes：用途：控制是否跳过未就绪 Hetu 模式；默认值：true；运行影响：开启后未配置模式不会导致整体路由失败。
      skip-unready-modes: true
    # 配置项 allowed-modes：用途：列出允许参与执行的 Hetu 模式；默认值：见其子项；运行影响：不在列表中的模式不会进入路由。
    allowed-modes:
      # 配置列表项 列表值：用途：允许 Hetu 模式 JDBC；默认值：当前列表项为 JDBC；运行影响：不在列表中的模式不会参与执行路由。
      - JDBC
      # 配置列表项 列表值：用途：允许 Hetu 模式 REST；默认值：当前列表项为 REST；运行影响：不在列表中的模式不会参与执行路由。
      - REST
      # 配置列表项 列表值：用途：允许 Hetu 模式 CLIENT；默认值：当前列表项为 CLIENT；运行影响：不在列表中的模式不会参与执行路由。
      - CLIENT
  # 配置项 routing：用途：配置查询路由策略；默认值：见其子项；运行影响：影响引擎优先级和 fallback 顺序。
  routing:
    # 配置项 preferred-engines：用途：定义查询路由优先引擎顺序；默认值：见其子项；运行影响：顺序变化会影响默认选用的执行引擎。
    preferred-engines:
      # 配置列表项 列表值：用途：把引擎 HETU 放入优先路由列表；默认值：当前列表项为 HETU；运行影响：顺序变化会影响默认选用的查询引擎。
      - HETU
      # 配置列表项 列表值：用途：把引擎 HIVE 放入优先路由列表；默认值：当前列表项为 HIVE；运行影响：顺序变化会影响默认选用的查询引擎。
      - HIVE

# 配置项 logging：用途：配置日志输出和级别；默认值：见其子项；运行影响：影响排障信息量、日志体积和生产可观测性。
logging:
  # 配置项 level：用途：配置日志级别集合；默认值：见其子项；运行影响：影响各包日志输出粒度。
  level:
    # 配置项 root：用途：配置根日志级别；默认值：INFO；运行影响：影响未单独指定包名的日志输出。
    root: INFO
    # 配置项 com.company.queryexecution：用途：设置 com.company.queryexecution 包日志级别；默认值：INFO；运行影响：级别越低该包日志越详细且日志量越大。
    com.company.queryexecution: INFO

# 配置项 auth：用途：配置请求鉴权开关和可信来源；默认值：见其子项；运行影响：影响受保护接口是否校验身份上下文。
auth:
  # 配置项 enabled：用途：控制上级功能是否启用；默认值：false；运行影响：关闭后上级功能不会进入运行路径。
  enabled: false
  # 配置项 trusted-auth-sources：用途：列出允许透传身份的来源；默认值：见其子项；运行影响：来源不匹配会导致请求被拒绝或测试假设失效。
  trusted-auth-sources:
    # 配置列表项 列表值：用途：允许身份来源 header；默认值：当前列表项为 header；运行影响：请求来源不在列表中会被鉴权拦截。
    - header
