spring:
  application:
    name: query-execution
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.queryexecution: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath*:mapper/*.xml

query-execution:
  safety:
    readonly-first: true
  parser:
    strategy: OPEN_SOURCE_ABSTRACTION_FOR_LIGHTWEIGHT_PATH
  rewrite:
    development-direct-success-enabled: ${QUERY_EXECUTION_REWRITE_DEV_DIRECT_SUCCESS_ENABLED:false}
  hetu:
    enabled: ${QUERY_EXECUTION_HETU_ENABLED:false}
    calibration:
      profile: ${QUERY_EXECUTION_HETU_CALIBRATION_PROFILE:REPO_CLOSED_BASELINE}
      skip-unready-modes: ${QUERY_EXECUTION_HETU_SKIP_UNREADY_MODES:true}
    cluster-evidence:
      evidence-source: ${QUERY_EXECUTION_HETU_EVIDENCE_SOURCE:REPO_CLOSED_CONFIGURATION}
      environment-label: ${QUERY_EXECUTION_HETU_ENVIRONMENT_LABEL:repo-default}
      cluster-name: ${QUERY_EXECUTION_HETU_CLUSTER_NAME:UNSPECIFIED}
      coordinator-endpoint: ${QUERY_EXECUTION_HETU_COORDINATOR_ENDPOINT:}
      runbook-ref: ${QUERY_EXECUTION_HETU_RUNBOOK_REF:docs/deployments/hetu-test-environment-deployment-runbook.md}
      evidence-ref: ${QUERY_EXECUTION_HETU_EVIDENCE_REF:HARN-016/INBOX-002}
      readonly-boundary: ${QUERY_EXECUTION_HETU_READONLY_BOUNDARY:REPO_CLOSED_DEFAULT}
      live-verification-status: ${QUERY_EXECUTION_HETU_LIVE_VERIFICATION_STATUS:PENDING_ENV_WINDOW}
      evidence-notes: ${QUERY_EXECUTION_HETU_EVIDENCE_NOTES:}
    jdbc:
      url: ${QUERY_EXECUTION_HETU_JDBC_URL:}
      username: ${QUERY_EXECUTION_HETU_JDBC_USERNAME:}
      password: ${QUERY_EXECUTION_HETU_JDBC_PASSWORD:}
      query-timeout-seconds: ${QUERY_EXECUTION_HETU_JDBC_QUERY_TIMEOUT_SECONDS:30}
      max-rows: ${QUERY_EXECUTION_HETU_JDBC_MAX_ROWS:200}
    rest:
      endpoint: ${QUERY_EXECUTION_HETU_REST_ENDPOINT:}
      auth-token: ${QUERY_EXECUTION_HETU_REST_AUTH_TOKEN:}
      connect-timeout-ms: ${QUERY_EXECUTION_HETU_REST_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${QUERY_EXECUTION_HETU_REST_READ_TIMEOUT_MS:5000}
      max-rows: ${QUERY_EXECUTION_HETU_REST_MAX_ROWS:200}
    client:
      enabled: ${QUERY_EXECUTION_HETU_CLIENT_ENABLED:false}
      endpoint: ${QUERY_EXECUTION_HETU_CLIENT_ENDPOINT:}
      user: ${QUERY_EXECUTION_HETU_CLIENT_USER:}
      source: ${QUERY_EXECUTION_HETU_CLIENT_SOURCE:sqlforge-query-execution}
      catalog: ${QUERY_EXECUTION_HETU_CLIENT_CATALOG:}
      schema: ${QUERY_EXECUTION_HETU_CLIENT_SCHEMA:}
      auth-token: ${QUERY_EXECUTION_HETU_CLIENT_AUTH_TOKEN:}
      connect-timeout-ms: ${QUERY_EXECUTION_HETU_CLIENT_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${QUERY_EXECUTION_HETU_CLIENT_READ_TIMEOUT_MS:5000}
      max-rows: ${QUERY_EXECUTION_HETU_CLIENT_MAX_ROWS:200}
      max-pages: ${QUERY_EXECUTION_HETU_CLIENT_MAX_PAGES:10}
  acceleration:
    ownership-mode: APPLY_ACTIVE_RUNTIME_CONFIG_ONLY
  cache:
    backend:
      type: ${QUERY_EXECUTION_CACHE_BACKEND_TYPE:IN_MEMORY}
      provider-name: ${QUERY_EXECUTION_CACHE_BACKEND_PROVIDER:REPO_CLOSED_IN_MEMORY}
      environment-label: ${QUERY_EXECUTION_CACHE_BACKEND_ENVIRONMENT:repo-default}
      default-max-entries-per-tenant: ${QUERY_EXECUTION_CACHE_DEFAULT_MAX_ENTRIES_PER_TENANT:1024}
      default-max-entries-per-policy: ${QUERY_EXECUTION_CACHE_DEFAULT_MAX_ENTRIES_PER_POLICY:128}
      default-ttl-seconds: ${QUERY_EXECUTION_CACHE_DEFAULT_TTL_SECONDS:0}
      redis:
        host: ${QUERY_EXECUTION_CACHE_REDIS_HOST:}
        port: ${QUERY_EXECUTION_CACHE_REDIS_PORT:6379}
        password: ${QUERY_EXECUTION_CACHE_REDIS_PASSWORD:}
        database: ${QUERY_EXECUTION_CACHE_REDIS_DATABASE:0}
        connect-timeout-ms: ${QUERY_EXECUTION_CACHE_REDIS_CONNECT_TIMEOUT_MS:1000}
        read-timeout-ms: ${QUERY_EXECUTION_CACHE_REDIS_READ_TIMEOUT_MS:1000}
  jdbc-agent:
    redis:
      enabled: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_ENABLED:false}
      namespace: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_NAMESPACE:sqlforge:jdbc-agent}
      host: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_HOST:}
      port: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_PORT:6379}
      password: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_PASSWORD:}
      database: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_DATABASE:0}
      connect-timeout-ms: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_READ_TIMEOUT_MS:1000}
      ttl-seconds: ${QUERY_EXECUTION_JDBC_AGENT_REDIS_TTL_SECONDS:0}
  governance:
    base-url: ${QUERY_EXECUTION_GOVERNANCE_BASE_URL:http://localhost:8080/api/governance/internal}
    connect-timeout-ms: ${QUERY_EXECUTION_GOVERNANCE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${QUERY_EXECUTION_GOVERNANCE_READ_TIMEOUT_MS:5000}
    datasource-id-map:
      AUTO: ${QUERY_EXECUTION_GOVERNANCE_DATASOURCE_AUTO:query-hetu}
      TRINO: ${QUERY_EXECUTION_GOVERNANCE_DATASOURCE_TRINO:query-trino}
      HETU: ${QUERY_EXECUTION_GOVERNANCE_DATASOURCE_HETU:query-hetu}
      HIVE: ${QUERY_EXECUTION_GOVERNANCE_DATASOURCE_HIVE:query-hive}
