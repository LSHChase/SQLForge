spring:
  application:
    name: query-execution
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.queryexecution: INFO

query-execution:
  safety:
    readonly-first: true
  parser:
    strategy: OPEN_SOURCE_ABSTRACTION_FOR_LIGHTWEIGHT_PATH
  acceleration:
    ownership-mode: APPLY_APPROVED_RUNTIME_CONFIG_ONLY
