query-execution:
  hetu:
    enabled: true
    calibration:
      profile: PRODUCTION_CANDIDATE_BASELINE
      route-order:
        - JDBC
        - REST
        - CLIENT
      skip-unready-modes: true
    allowed-modes:
      - JDBC
      - REST
      - CLIENT
  routing:
    preferred-engines:
      - HETU
      - SPARK

logging:
  level:
    root: INFO
    com.company.queryexecution: INFO
  config: classpath:logback-spring.xml

auth:
  enabled: true
  trusted-auth-sources:
    - gateway
    - token
