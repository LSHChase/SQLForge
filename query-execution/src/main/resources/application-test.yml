query-execution:
  hetu:
    enabled: false
    calibration:
      profile: REPO_CLOSED_BASELINE
      route-order:
        - JDBC
        - REST
        - CLIENT
      skip-unready-modes: true
    allowed-modes:
      - JDBC
      - REST
      - CLIENT
  routing:
    preferred-engines:
      - HETU

logging:
  level:
    com.company.queryexecution: INFO

auth:
  enabled: true
  trusted-auth-sources:
    - header
    - gateway
