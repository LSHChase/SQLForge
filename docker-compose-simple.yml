services:
  # Kafka由R-144数据库模拟模式替代，本地开发不部署。
  mysql:
    image: mysql:8.0
    container_name: sqlforge-mysql-simple
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sqlforge
      MYSQL_DATABASE: sqlforge
      MYSQL_USER: sqlforge
      MYSQL_PASSWORD: sqlforge
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-simple-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psqlforge --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7
    container_name: sqlforge-redis-simple
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-simple-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-simple-data:
  redis-simple-data:
