server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  mvc:
    problemdetails:
      enabled: true

sqlforge:
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*
  storage:
    connections-file: ${java.io.tmpdir}/sqlforge/connections.json
    workflow-baselines-file: ${java.io.tmpdir}/sqlforge/workflow-baselines.json
