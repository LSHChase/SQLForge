spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_TEST_CRYPTO_KEY_ID:sql-optimization-test-key}
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_TEST_CRYPTO_KEY_BASE64:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}

sql-optimization:
  parse-history:
    repository: test
  hetu-plan:
    enabled: false
  queues:
    mode: local-placeholder
