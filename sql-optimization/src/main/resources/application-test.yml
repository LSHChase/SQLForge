# 配置项 spring：说明该配置的用途、默认值或运行影响。
spring:
  # 配置项 autoconfigure：说明该配置的用途、默认值或运行影响。
  autoconfigure:
    # 配置项 exclude：说明该配置的用途、默认值或运行影响。
    exclude:
      # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

# 配置项 auth：说明该配置的用途、默认值或运行影响。
auth:
  # 配置项 enabled：说明该配置的用途、默认值或运行影响。
  enabled: false
  # 配置项 trusted-auth-sources：说明该配置的用途、默认值或运行影响。
  trusted-auth-sources:
    # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
    - header

# 配置项 sqlforge：说明该配置的用途、默认值或运行影响。
sqlforge:
  # 配置项 security：说明该配置的用途、默认值或运行影响。
  security:
    # 配置项 crypto：说明该配置的用途、默认值或运行影响。
    crypto:
      # 配置项 algorithm：说明该配置的用途、默认值或运行影响。
      algorithm: AES256_GCM
      # 配置项 key-id：说明该配置的用途、默认值或运行影响。
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_TEST_CRYPTO_KEY_ID:sql-optimization-test-key}
      # 配置项 base64-key：说明该配置的用途、默认值或运行影响。
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_TEST_CRYPTO_KEY_BASE64:MDEyMzQ1Njc4OUFCQ0RFRjAxMjM0NTY3ODlBQkNERUY=}

# 配置项 sql-optimization：说明该配置的用途、默认值或运行影响。
sql-optimization:
  # 配置项 parse-history：说明该配置的用途、默认值或运行影响。
  parse-history:
    # 配置项 repository：说明该配置的用途、默认值或运行影响。
    repository: test
  # 配置项 parse-batch：说明该配置的用途、默认值或运行影响。
  parse-batch:
    # 配置项 repository：说明该配置的用途、默认值或运行影响。
    repository: test
  # 配置项 recommendation：说明该配置的用途、默认值或运行影响。
  recommendation:
    # 配置项 repository：说明该配置的用途、默认值或运行影响。
    repository: test
  # 配置项 dispatch-event：说明该配置的用途、默认值或运行影响。
  dispatch-event:
    # 配置项 repository：说明该配置的用途、默认值或运行影响。
    repository: test
  # 配置项 rewrite-trial：说明该配置的用途、默认值或运行影响。
  rewrite-trial:
    # 配置项 repository：说明该配置的用途、默认值或运行影响。
    repository: test
  # 配置项 hetu-plan：说明该配置的用途、默认值或运行影响。
  hetu-plan:
    # 配置项 enabled：说明该配置的用途、默认值或运行影响。
    enabled: false
  # 配置项 rewrite-validation-scheduler：说明该配置的用途、默认值或运行影响。
  rewrite-validation-scheduler:
    # 配置项 enabled：说明该配置的用途、默认值或运行影响。
    enabled: false
  # 配置项 queues：说明该配置的用途、默认值或运行影响。
  queues:
    # 配置项 mode：说明该配置的用途、默认值或运行影响。
    mode: local-placeholder
