# 配置项 spring：用途：承载 Spring 应用基础配置；默认值：见其子项；运行影响：影响应用名称、激活环境、数据源和自动装配。
spring:
  # 配置项 application：用途：定义 Spring 应用元信息；默认值：见其子项；运行影响：影响服务标识、日志上下文和运行状态识别。
  application:
    # 配置项 name：用途：定义 SQL 优化服务应用名；默认值：sql-optimization；运行影响：影响日志标识、Actuator 信息和服务上下文识别。
    name: sql-optimization
  # 配置项 profiles：用途：定义环境 profile 配置；默认值：见其子项；运行影响：影响加载 dev、test、prod 或 compose profile 的配置分支。
  profiles:
    # 配置项 active：用途：选择默认激活的 Spring profile；默认值：环境变量 SPRING_PROFILES_ACTIVE，未设置时为 dev；运行影响：决定未显式指定环境时加载哪套配置。
    active: ${SPRING_PROFILES_ACTIVE:dev}

# 配置项 server：用途：配置服务 HTTP 容器；默认值：见其子项；运行影响：影响接口监听端口和内嵌容器行为。
server:
  # 配置项 port：用途：指定服务监听或依赖连接端口；默认值：8082；运行影响：端口变化会影响访问地址和端口冲突风险。
  port: 8082

# 配置项 management：用途：配置 Actuator 管理端点；默认值：见其子项；运行影响：影响健康检查、指标和 Prometheus 暴露。
management:
  # 配置项 endpoints：用途：配置管理端点集合；默认值：见其子项；运行影响：影响可通过 HTTP 暴露的运维入口。
  endpoints:
    # 配置项 web：用途：配置管理端点的 Web 暴露方式；默认值：见其子项；运行影响：影响管理端点能否通过 HTTP 访问。
    web:
      # 配置项 exposure：用途：配置端点暴露范围；默认值：见其子项；运行影响：暴露过多会扩大运维接口可见面。
      exposure:
        # 配置项 include：用途：列出允许暴露或加载的条目；默认值：health,info,metrics,prometheus；运行影响：决定对应端点或配置是否生效。
        include: health,info,metrics,prometheus
  # 配置项 endpoint：用途：指定外部服务或对象存储端点；默认值：见其子项；运行影响：端点错误会导致客户端连接失败。
  endpoint:
    # 配置项 health：用途：配置健康检查端点；默认值：见其子项；运行影响：影响服务健康信息展示深度。
    health:
      # 配置项 show-details：用途：控制健康详情展示策略；默认值：always；运行影响：展示过多会增加环境信息暴露面。
      show-details: always

# 配置项 logging：用途：配置日志输出和级别；默认值：见其子项；运行影响：影响排障信息量、日志体积和生产可观测性。
logging:
  # 配置项 level：用途：配置日志级别集合；默认值：见其子项；运行影响：影响各包日志输出粒度。
  level:
    # 配置项 root：用途：配置根日志级别；默认值：INFO；运行影响：影响未单独指定包名的日志输出。
    root: INFO
    # 配置项 com.company.sqloptimization：用途：设置 com.company.sqloptimization 包日志级别；默认值：INFO；运行影响：级别越低该包日志越详细且日志量越大。
    com.company.sqloptimization: INFO

# 配置项 mybatis：用途：配置 MyBatis 运行参数；默认值：见其子项；运行影响：影响 mapper XML 加载和字段映射。
mybatis:
  # 配置项 config-location：用途：指定 MyBatis 全局配置文件；默认值：classpath:mybatis-config.xml；运行影响：路径错误会导致 MyBatis 初始化失败。
  config-location: classpath:mybatis-config.xml
  # 配置项 mapper-locations：用途：指定 MyBatis mapper XML 扫描路径；默认值：classpath*:mapper/*.xml；运行影响：路径错误会导致 SQL mapper 不可用。
  mapper-locations: classpath*:mapper/*.xml

# 配置项 sql-optimization：用途：配置 SQL 优化服务或优化客户端；默认值：见其子项；运行影响：影响解析、推荐、改写和计划分析。
sql-optimization:
  # 配置项 parser：用途：配置 SQL 解析策略；默认值：见其子项；运行影响：影响轻量解析、任务解析和改写入口。
  parser:
    # 配置项 strategy：用途：指定解析或处理策略；默认值：环境变量 SQL_OPTIMIZATION_PARSER_STRATEGY，未设置时为 JSQLPARSER；运行影响：策略变化会切换底层解析实现。
    strategy: ${SQL_OPTIMIZATION_PARSER_STRATEGY:JSQLPARSER}
  # 配置项 parse-history：用途：配置解析历史存储；默认值：见其子项；运行影响：影响解析结果是否写入长期历史。
  parse-history:
    # 配置项 repository：用途：选择上级功能的 repository 实现；默认值：环境变量 SQL_OPTIMIZATION_PARSE_HISTORY_REPOSITORY，未设置时为 database；运行影响：database 会落库，test/local 会使用测试或占位实现。
    repository: ${SQL_OPTIMIZATION_PARSE_HISTORY_REPOSITORY:database}
  # 配置项 parse-batch：用途：配置批量解析存储；默认值：见其子项；运行影响：影响批量解析任务和明细持久化。
  parse-batch:
    # 配置项 repository：用途：选择上级功能的 repository 实现；默认值：环境变量 SQL_OPTIMIZATION_PARSE_BATCH_REPOSITORY，未设置时为 database；运行影响：database 会落库，test/local 会使用测试或占位实现。
    repository: ${SQL_OPTIMIZATION_PARSE_BATCH_REPOSITORY:database}
  # 配置项 report-batch：用途：配置报表批量解析存储；默认值：见其子项；运行影响：影响报表导入解析任务和统计持久化。
  report-batch:
    # 配置项 repository：用途：选择上级功能的 repository 实现；默认值：环境变量 SQL_OPTIMIZATION_REPORT_BATCH_REPOSITORY，未设置时为 database；运行影响：database 会落库，test/local 会使用测试或占位实现。
    repository: ${SQL_OPTIMIZATION_REPORT_BATCH_REPOSITORY:database}
  # 配置项 recommendation：用途：配置推荐结果存储；默认值：见其子项；运行影响：影响优化推荐查询和历史追溯。
  recommendation:
    # 配置项 repository：用途：选择上级功能的 repository 实现；默认值：环境变量 SQL_OPTIMIZATION_RECOMMENDATION_REPOSITORY，未设置时为 database；运行影响：database 会落库，test/local 会使用测试或占位实现。
    repository: ${SQL_OPTIMIZATION_RECOMMENDATION_REPOSITORY:database}
  # 配置项 dispatch-event：用途：配置调度事件存储；默认值：见其子项；运行影响：影响异步事件追踪和回放。
  dispatch-event:
    # 配置项 repository：用途：选择上级功能的 repository 实现；默认值：环境变量 SQL_OPTIMIZATION_DISPATCH_EVENT_REPOSITORY，未设置时为 database；运行影响：database 会落库，test/local 会使用测试或占位实现。
    repository: ${SQL_OPTIMIZATION_DISPATCH_EVENT_REPOSITORY:database}
  # 配置项 rewrite-trial：用途：配置改写试算存储；默认值：见其子项；运行影响：影响试算结果和验证历史保存。
  rewrite-trial:
    # 配置项 repository：用途：选择上级功能的 repository 实现；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_TRIAL_REPOSITORY，未设置时为 database；运行影响：database 会落库，test/local 会使用测试或占位实现。
    repository: ${SQL_OPTIMIZATION_REWRITE_TRIAL_REPOSITORY:database}
  # 配置项 task-model：用途：配置任务模型元数据；默认值：见其子项；运行影响：影响任务隔离队列和阶段说明。
  task-model:
    # 配置项 isolated-queue：用途：控制任务是否使用隔离队列；默认值：true；运行影响：关闭会让任务共用队列语义。
    isolated-queue: true
    # 配置项 contract-stage：用途：标记配置契约阶段；默认值：LONG_TERM_BASELINE；运行影响：用于运行证据和文档真值追溯。
    contract-stage: LONG_TERM_BASELINE
    # 配置项 implementation-stage：用途：标记当前实现阶段；默认值：DATABASE_SCHEDULED_WORKER_BASELINE；运行影响：用于区分目标架构和已实现事实。
    implementation-stage: DATABASE_SCHEDULED_WORKER_BASELINE
  # 配置项 task-execution：用途：配置异步任务执行节奏；默认值：见其子项；运行影响：影响 worker 轮询、可见性延迟和阶段推进速度。
  task-execution:
    # 配置项 poll-interval-ms：用途：设置任务轮询间隔毫秒数；默认值：25；运行影响：间隔越短处理越快但数据库访问更频繁。
    poll-interval-ms: 25
    # 配置项 queue-visibility-delay-ms：用途：设置队列可见性延迟；默认值：100；运行影响：延迟越长并发重复获取概率越低但任务启动更慢。
    queue-visibility-delay-ms: 100
    # 配置项 phase-delay-ms：用途：设置任务阶段推进延迟；默认值：40；运行影响：影响测试和本地 worker 的状态流转速度。
    phase-delay-ms: 40
  # 配置项 governance：用途：配置治理服务或治理客户端能力；默认值：见其子项；运行影响：影响租户校验、审计写入和跨服务治理调用。
  governance:
    # 配置项 base-url：用途：指定内部服务调用基地址；默认值：环境变量 SQL_OPTIMIZATION_GOVERNANCE_BASE_URL，未设置时为 http://localhost:8080/api/governance/internal；运行影响：地址错误会导致跨服务调用失败。
    base-url: ${SQL_OPTIMIZATION_GOVERNANCE_BASE_URL:http://localhost:8080/api/governance/internal}
    # 配置项 connect-timeout-ms：用途：设置建立连接超时时间；默认值：环境变量 SQL_OPTIMIZATION_GOVERNANCE_CONNECT_TIMEOUT_MS，未设置时为 3000；运行影响：过短会误判网络抖动，过长会拖慢失败返回。
    connect-timeout-ms: ${SQL_OPTIMIZATION_GOVERNANCE_CONNECT_TIMEOUT_MS:3000}
    # 配置项 read-timeout-ms：用途：设置读取响应超时时间；默认值：环境变量 SQL_OPTIMIZATION_GOVERNANCE_READ_TIMEOUT_MS，未设置时为 5000；运行影响：过短会中断慢请求，过长会占用调用线程。
    read-timeout-ms: ${SQL_OPTIMIZATION_GOVERNANCE_READ_TIMEOUT_MS:5000}
    # 配置项 datasource-id-map：用途：配置引擎类型到治理数据源 ID 的映射；默认值：见其子项；运行影响：映射错误会导致治理访问校验使用错误数据源。
    datasource-id-map:
      # 配置项 AUTO：用途：将 AUTO 映射到治理数据源 ID；默认值：环境变量 SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_AUTO，未设置时为 optimization-hetu；运行影响：映射错误会导致访问校验使用错误数据源。
      AUTO: ${SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_AUTO:optimization-hetu}
      # 配置项 HETU：用途：将 HETU 映射到治理数据源 ID；默认值：环境变量 SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_HETU，未设置时为 optimization-hetu；运行影响：映射错误会导致访问校验使用错误数据源。
      HETU: ${SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_HETU:optimization-hetu}
      # 配置项 HIVE：用途：将 HIVE 映射到治理数据源 ID；默认值：环境变量 SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_HIVE，未设置时为 optimization-hive；运行影响：映射错误会导致访问校验使用错误数据源。
      HIVE: ${SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_HIVE:optimization-hive}
  # 配置项 query-execution：用途：配置查询执行服务或查询执行客户端；默认值：见其子项；运行影响：影响查询路由、Hetu 接入和加速命中。
  query-execution:
    # 配置项 base-url：用途：指定内部服务调用基地址；默认值：环境变量 SQL_OPTIMIZATION_QUERY_EXECUTION_BASE_URL，未设置时为 http://localhost:8081/api/query-execution/internal/acceleration-plans；运行影响：地址错误会导致跨服务调用失败。
    base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_BASE_URL:http://localhost:8081/api/query-execution/internal/acceleration-plans}
    # 配置项 result-digest-base-url：用途：指定查询结果摘要接口地址；默认值：环境变量 SQL_OPTIMIZATION_QUERY_EXECUTION_RESULT_DIGEST_BASE_URL，未设置时为 http://localhost:8081/api/query-execution/internal/result-digests；运行影响：地址错误会导致改写验证无法获取结果摘要。
    result-digest-base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_RESULT_DIGEST_BASE_URL:http://localhost:8081/api/query-execution/internal/result-digests}
    # 配置项 rewrite-binding-base-url：用途：指定 runtime rewrite binding 接口地址；默认值：环境变量 SQL_OPTIMIZATION_QUERY_EXECUTION_REWRITE_BINDING_BASE_URL，未设置时为 http://localhost:8081/api/query-execution/internal/rewrite-bindings；运行影响：地址错误会导致生产改写绑定写入失败。
    rewrite-binding-base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_REWRITE_BINDING_BASE_URL:http://localhost:8081/api/query-execution/internal/rewrite-bindings}
    # 配置项 materialized-view-base-url：用途：指定物化视图接口地址；默认值：环境变量 SQL_OPTIMIZATION_QUERY_EXECUTION_MATERIALIZED_VIEW_BASE_URL，未设置时为 http://localhost:8081/api/query-execution/internal/materialized-views；运行影响：地址错误会导致物化视图候选协同失败。
    materialized-view-base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_MATERIALIZED_VIEW_BASE_URL:http://localhost:8081/api/query-execution/internal/materialized-views}
    # 配置项 connect-timeout-ms：用途：设置建立连接超时时间；默认值：环境变量 SQL_OPTIMIZATION_QUERY_EXECUTION_CONNECT_TIMEOUT_MS，未设置时为 3000；运行影响：过短会误判网络抖动，过长会拖慢失败返回。
    connect-timeout-ms: ${SQL_OPTIMIZATION_QUERY_EXECUTION_CONNECT_TIMEOUT_MS:3000}
    # 配置项 read-timeout-ms：用途：设置读取响应超时时间；默认值：环境变量 SQL_OPTIMIZATION_QUERY_EXECUTION_READ_TIMEOUT_MS，未设置时为 5000；运行影响：过短会中断慢请求，过长会占用调用线程。
    read-timeout-ms: ${SQL_OPTIMIZATION_QUERY_EXECUTION_READ_TIMEOUT_MS:5000}
  # 配置项 rewrite-production：用途：配置生产改写增强能力；默认值：见其子项；运行影响：影响 Calcite、RelToSql、SMT 和成本增强是否接入。
  rewrite-production:
    # 配置项 development-direct-activation-enabled：用途：控制开发环境改写直通激活；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_DEV_DIRECT_ACTIVATION_ENABLED，未设置时为 false；运行影响：开启会跳过生产激活前置，仅用于开发验证。
    development-direct-activation-enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_DEV_DIRECT_ACTIVATION_ENABLED:false}
    # 配置项 calcite-rel-node：用途：配置 Calcite RelNode 增强；默认值：见其子项；运行影响：影响关系代数候选生成能力。
    calcite-rel-node:
      # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_CALCITE_RELNODE_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_CALCITE_RELNODE_ENABLED:false}
    # 配置项 rel-to-sql：用途：配置 RelToSql 增强；默认值：见其子项；运行影响：影响关系代数候选回写 SQL 能力。
    rel-to-sql:
      # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_REL_TO_SQL_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_REL_TO_SQL_ENABLED:false}
    # 配置项 jsql-parser-metadata：用途：配置 JSqlParser 元数据增强；默认值：见其子项；运行影响：影响解析结果中的表列元信息。
    jsql-parser-metadata:
      # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_JSQLPARSER_METADATA_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_JSQLPARSER_METADATA_ENABLED:false}
    # 配置项 smt-z3：用途：配置 Z3 SMT 语义验证增强；默认值：见其子项；运行影响：影响等价验证是否调用外部求解器。
    smt-z3:
      # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_SMT_Z3_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_SMT_Z3_ENABLED:false}
      # 配置项 command：用途：指定容器启动参数或外部命令；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_SMT_Z3_COMMAND，未设置时为 空值；运行影响：命令变化会直接改变组件启动或增强能力调用方式。
      command: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_SMT_Z3_COMMAND:}
    # 配置项 hetu-explain-cost：用途：配置 Hetu EXPLAIN 成本增强；默认值：见其子项；运行影响：影响候选排序是否使用真实计划成本。
    hetu-explain-cost:
      # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_HETU_EXPLAIN_COST_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_HETU_EXPLAIN_COST_ENABLED:false}
    # 配置项 statistics-cost：用途：配置统计信息成本增强；默认值：见其子项；运行影响：影响候选排序是否使用外部统计信息。
    statistics-cost:
      # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_STATISTICS_COST_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_STATISTICS_COST_ENABLED:false}
      # 配置项 statistics-source：用途：指定统计信息来源；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_PRODUCTION_STATISTICS_SOURCE，未设置时为 空值；运行影响：为空表示不读取外部统计源。
      statistics-source: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_STATISTICS_SOURCE:}
  # 配置项 rewrite-validation-scheduler：用途：配置改写验证调度器；默认值：见其子项；运行影响：影响改写验证任务是否定期自动扫描。
  rewrite-validation-scheduler:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
    enabled: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_ENABLED:false}
    # 配置项 fixed-delay-ms：用途：设置调度器固定延迟；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_FIXED_DELAY_MS，未设置时为 60000；运行影响：延迟越短扫描越频繁。
    fixed-delay-ms: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_FIXED_DELAY_MS:60000}
    # 配置项 batch-size：用途：设置单批处理数量；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_BATCH_SIZE，未设置时为 20；运行影响：数值越大吞吐越高但单批资源占用更大。
    batch-size: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_BATCH_SIZE:20}
    # 配置项 max-age-minutes：用途：设置待验证记录最大年龄；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_MAX_AGE_MINUTES，未设置时为 1440；运行影响：超过该时间的记录会被调度器纳入扫描。
    max-age-minutes: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_MAX_AGE_MINUTES:1440}
    # 配置项 trigger-reason：用途：指定调度触发原因标识；默认值：环境变量 SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_TRIGGER_REASON，未设置时为 SCHEDULED_VALIDATION；运行影响：影响验证记录和审计中的触发来源。
    trigger-reason: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_TRIGGER_REASON:SCHEDULED_VALIDATION}
  # 配置项 view-metadata：用途：配置视图元数据读取；默认值：见其子项；运行影响：影响物化视图或逻辑视图分析能力。
  view-metadata:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_VIEW_METADATA_ENABLED，未设置时为 true；运行影响：关闭后上级功能不会进入运行路径。
    enabled: ${SQL_OPTIMIZATION_VIEW_METADATA_ENABLED:true}
    # 配置项 query-timeout-seconds：用途：设置查询或计划分析超时秒数；默认值：环境变量 SQL_OPTIMIZATION_VIEW_METADATA_QUERY_TIMEOUT_SECONDS，未设置时为 3；运行影响：过短会中断慢查询，过长会拖慢失败返回。
    query-timeout-seconds: ${SQL_OPTIMIZATION_VIEW_METADATA_QUERY_TIMEOUT_SECONDS:3}
  # 配置项 hetu-plan：用途：配置 Hetu 计划分析能力；默认值：见其子项；运行影响：影响是否连接 Hetu 获取 explain plan。
  hetu-plan:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
    enabled: ${SQL_OPTIMIZATION_HETU_PLAN_ENABLED:false}
    # 配置项 query-timeout-seconds：用途：设置查询或计划分析超时秒数；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_QUERY_TIMEOUT_SECONDS，未设置时为 5；运行影响：过短会中断慢查询，过长会拖慢失败返回。
    query-timeout-seconds: ${SQL_OPTIMIZATION_HETU_PLAN_QUERY_TIMEOUT_SECONDS:5}
    # 配置项 datasources：用途：列出计划分析可用的数据源；默认值：见其子项；运行影响：缺失会导致对应数据源无法做计划分析。
    datasources:
      # 配置项 hetu_main：用途：定义计划分析数据源 hetu_main；默认值：见其子项；运行影响：连接参数缺失会导致该数据源无法执行计划分析。
      hetu_main:
        # 配置项 driver-class-name：用途：指定 JDBC 驱动类；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_DRIVER，未设置时为 空值；运行影响：驱动不匹配会导致数据库连接初始化失败。
        driver-class-name: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_DRIVER:}
        # 配置项 jdbc-url：用途：指定 JDBC 连接地址；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_JDBC_URL，未设置时为 空值；运行影响：地址错误会导致计划分析或数据库访问失败。
        jdbc-url: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_JDBC_URL:}
        # 配置项 username：用途：指定连接账号；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_USERNAME，未设置时为 空值；运行影响：账号错误会导致认证失败。
        username: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_USERNAME:}
        # 配置项 password：用途：指定连接密码或令牌；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_PASSWORD，未设置时为 空值；运行影响：为空或错误会导致认证失败，生产必须由环境变量注入。
        password: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_PASSWORD:}
  # 配置项 queues：用途：配置任务队列实现；默认值：见其子项；运行影响：影响任务获取、外部文件队列和 worker 模式。
  queues:
    # 配置项 mode：用途：选择上级模块运行模式；默认值：database-worker；运行影响：模式变化会切换实现路径和外部依赖。
    mode: database-worker

# 配置项 auth：用途：配置请求鉴权开关和可信来源；默认值：见其子项；运行影响：影响受保护接口是否校验身份上下文。
auth:
  # 配置项 enabled：用途：控制上级功能是否启用；默认值：false；运行影响：关闭后上级功能不会进入运行路径。
  enabled: false
  # 配置项 trusted-auth-sources：用途：列出允许透传身份的来源；默认值：见其子项；运行影响：来源不匹配会导致请求被拒绝或测试假设失效。
  trusted-auth-sources:
    # 配置列表项 列表值：用途：允许身份来源 header；默认值：当前列表项为 header；运行影响：请求来源不在列表中会被鉴权拦截。
    - header

# 配置项 sqlforge：用途：承载 SQLForge 公共配置；默认值：见其子项；运行影响：影响安全、存储和治理公共能力。
sqlforge:
  # 配置项 security：用途：承载安全相关配置；默认值：见其子项；运行影响：影响敏感字段加密和认证安全边界。
  security:
    # 配置项 crypto：用途：配置敏感字段加密组件；默认值：见其子项；运行影响：配置错误会导致密文无法解密或写入失败。
    crypto:
      # 配置项 algorithm：用途：指定加密算法标识；默认值：AES256_GCM；运行影响：算法不匹配会导致加解密不兼容。
      algorithm: AES256_GCM
      # 配置项 key-id：用途：指定当前密钥标识；默认值：环境变量 SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_ID，未设置时为 sql-optimization-dev-key；运行影响：影响密文元数据和密钥轮换追溯。
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_ID:sql-optimization-dev-key}
      # 配置项 base64-key：用途：提供 Base64 编码的加密密钥；默认值：环境变量 SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_BASE64，未设置时为 空值；运行影响：为空会使加密组件无法进行真实加解密。
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_BASE64:}
