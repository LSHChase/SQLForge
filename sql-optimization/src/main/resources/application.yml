spring:
  application:
    name: sql-optimization
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.sqloptimization: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath*:mapper/*.xml

sql-optimization:
  parser:
    strategy: ${SQL_OPTIMIZATION_PARSER_STRATEGY:JSQLPARSER}
  parse-history:
    repository: ${SQL_OPTIMIZATION_PARSE_HISTORY_REPOSITORY:database}
  parse-batch:
    repository: ${SQL_OPTIMIZATION_PARSE_BATCH_REPOSITORY:database}
  recommendation:
    repository: ${SQL_OPTIMIZATION_RECOMMENDATION_REPOSITORY:database}
  dispatch-event:
    repository: ${SQL_OPTIMIZATION_DISPATCH_EVENT_REPOSITORY:database}
  rewrite-trial:
    repository: ${SQL_OPTIMIZATION_REWRITE_TRIAL_REPOSITORY:database}
  task-model:
    isolated-queue: true
    contract-stage: LONG_TERM_BASELINE
    implementation-stage: DATABASE_SCHEDULED_WORKER_BASELINE
  task-execution:
    poll-interval-ms: 25
    queue-visibility-delay-ms: 100
    phase-delay-ms: 40
  governance:
    base-url: ${SQL_OPTIMIZATION_GOVERNANCE_BASE_URL:http://localhost:8080/api/governance/internal}
    connect-timeout-ms: ${SQL_OPTIMIZATION_GOVERNANCE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SQL_OPTIMIZATION_GOVERNANCE_READ_TIMEOUT_MS:5000}
    datasource-id-map:
      AUTO: ${SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_AUTO:optimization-hetu}
      HETU: ${SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_HETU:optimization-hetu}
      HIVE: ${SQL_OPTIMIZATION_GOVERNANCE_DATASOURCE_HIVE:optimization-hive}
  query-execution:
    base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_BASE_URL:http://localhost:8081/api/query-execution/internal/acceleration-plans}
    result-digest-base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_RESULT_DIGEST_BASE_URL:http://localhost:8081/api/query-execution/internal/result-digests}
    rewrite-binding-base-url: ${SQL_OPTIMIZATION_QUERY_EXECUTION_REWRITE_BINDING_BASE_URL:http://localhost:8081/api/query-execution/internal/rewrite-bindings}
    connect-timeout-ms: ${SQL_OPTIMIZATION_QUERY_EXECUTION_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SQL_OPTIMIZATION_QUERY_EXECUTION_READ_TIMEOUT_MS:5000}
  rewrite-production:
    development-direct-activation-enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_DEV_DIRECT_ACTIVATION_ENABLED:false}
    calcite-rel-node:
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_CALCITE_RELNODE_ENABLED:false}
    rel-to-sql:
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_REL_TO_SQL_ENABLED:false}
    jsql-parser-metadata:
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_JSQLPARSER_METADATA_ENABLED:false}
    smt-z3:
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_SMT_Z3_ENABLED:false}
      command: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_SMT_Z3_COMMAND:}
    hetu-explain-cost:
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_HETU_EXPLAIN_COST_ENABLED:false}
    statistics-cost:
      enabled: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_STATISTICS_COST_ENABLED:false}
      statistics-source: ${SQL_OPTIMIZATION_REWRITE_PRODUCTION_STATISTICS_SOURCE:}
  rewrite-validation-scheduler:
    enabled: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_ENABLED:false}
    fixed-delay-ms: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_FIXED_DELAY_MS:60000}
    batch-size: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_BATCH_SIZE:20}
    max-age-minutes: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_MAX_AGE_MINUTES:1440}
    trigger-reason: ${SQL_OPTIMIZATION_REWRITE_VALIDATION_SCHEDULER_TRIGGER_REASON:SCHEDULED_VALIDATION}
  view-metadata:
    enabled: ${SQL_OPTIMIZATION_VIEW_METADATA_ENABLED:true}
    query-timeout-seconds: ${SQL_OPTIMIZATION_VIEW_METADATA_QUERY_TIMEOUT_SECONDS:3}
  hetu-plan:
    enabled: ${SQL_OPTIMIZATION_HETU_PLAN_ENABLED:false}
    query-timeout-seconds: ${SQL_OPTIMIZATION_HETU_PLAN_QUERY_TIMEOUT_SECONDS:5}
    datasources:
      hetu_main:
        driver-class-name: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_DRIVER:}
        jdbc-url: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_JDBC_URL:}
        username: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_USERNAME:}
        password: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_PASSWORD:}
  queues:
    mode: database-worker

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_ID:sql-optimization-dev-key}
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_BASE64:}
