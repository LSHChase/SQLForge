spring:
  application:
    name: sql-optimization
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.sqloptimization: INFO

sql-optimization:
  parser:
    strategy: OPEN_SOURCE_ABSTRACTION_FOR_DEEP_OPTIMIZATION
  task-model:
    isolated-queue: true
    contract-stage: LONG_TERM_BASELINE
    implementation-stage: ASYNC_TASK_API_SKELETON
  task-execution:
    poll-interval-ms: 25
    queue-visibility-delay-ms: 100
    phase-delay-ms: 40

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_ID:sql-optimization-dev-key}
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_CRYPTO_KEY_BASE64:}
