spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SQLFORGE_DEV_DB_URL:jdbc:mysql://localhost:3306/sqlforge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SQLFORGE_DEV_DB_USER:sqlforge}
    password: ${SQLFORGE_DEV_DB_PASSWORD:sqlforge}

logging:
  level:
    root: DEBUG
    com.company.sqloptimization: DEBUG
    org.mybatis: DEBUG

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_DEV_CRYPTO_KEY_ID:sql-optimization-dev-key}
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_DEV_CRYPTO_KEY_BASE64:}

sql-optimization:
  callbacks:
    enabled: false
  hetu-plan:
    enabled: ${SQL_OPTIMIZATION_HETU_PLAN_ENABLED:false}
    query-timeout-seconds: ${SQL_OPTIMIZATION_HETU_PLAN_QUERY_TIMEOUT_SECONDS:5}
    datasources:
      hetu_main:
        driver-class-name: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_DRIVER:}
        jdbc-url: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_JDBC_URL:}
        username: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_USERNAME:}
        password: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_PASSWORD:}
