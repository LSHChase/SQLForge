# 配置项 spring：用途：承载 Spring 应用基础配置；默认值：见其子项；运行影响：影响应用名称、激活环境、数据源和自动装配。
spring:
  # 配置项 datasource：用途：配置服务数据库连接；默认值：见其子项；运行影响：影响持久化、查询和任务状态读写。
  datasource:
    # 配置项 driver-class-name：用途：指定 JDBC 驱动类；默认值：com.mysql.cj.jdbc.Driver；运行影响：驱动不匹配会导致数据库连接初始化失败。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 配置项 url：用途：指定数据库或服务访问地址；默认值：环境变量 SQLFORGE_DEV_DB_URL，未设置时为 jdbc:mysql://localhost:3306/sqlforge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true；运行影响：地址错误会导致运行时连接失败。
    url: ${SQLFORGE_DEV_DB_URL:jdbc:mysql://localhost:3306/sqlforge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    # 配置项 username：用途：指定连接账号；默认值：环境变量 SQLFORGE_DEV_DB_USER，未设置时为 sqlforge；运行影响：账号错误会导致认证失败。
    username: ${SQLFORGE_DEV_DB_USER:sqlforge}
    # 配置项 password：用途：指定连接密码或令牌；默认值：环境变量 SQLFORGE_DEV_DB_PASSWORD，未设置时为 sqlforge；运行影响：为空或错误会导致认证失败，生产必须由环境变量注入。
    password: ${SQLFORGE_DEV_DB_PASSWORD:sqlforge}

# 配置项 logging：用途：配置日志输出和级别；默认值：见其子项；运行影响：影响排障信息量、日志体积和生产可观测性。
logging:
  # 配置项 level：用途：配置日志级别集合；默认值：见其子项；运行影响：影响各包日志输出粒度。
  level:
    # 配置项 root：用途：配置根日志级别；默认值：INFO；运行影响：影响未单独指定包名的日志输出。
    root: INFO
    # 配置项 com.company.sqloptimization：用途：设置 com.company.sqloptimization 包日志级别；默认值：INFO；运行影响：级别越低该包日志越详细且日志量越大。
    com.company.sqloptimization: INFO
    # 配置项 org.mybatis：用途：设置 org.mybatis 包日志级别；默认值：INFO；运行影响：级别越低该包日志越详细且日志量越大。
    org.mybatis: INFO

# 配置项 auth：用途：配置请求鉴权开关和可信来源；默认值：见其子项；运行影响：影响受保护接口是否校验身份上下文。
auth:
  # 配置项 enabled：用途：控制上级功能是否启用；默认值：false；运行影响：关闭后上级功能不会进入运行路径。
  enabled: false
  # 配置项 trusted-auth-sources：用途：列出允许透传身份的来源；默认值：见其子项；运行影响：来源不匹配会导致请求被拒绝或测试假设失效。
  trusted-auth-sources:
    # 配置列表项 列表值：用途：允许身份来源 header；默认值：当前列表项为 header；运行影响：请求来源不在列表中会被鉴权拦截。
    - header

# 配置项 sqlforge：用途：承载 SQLForge 公共配置；默认值：见其子项；运行影响：影响安全、存储和治理公共能力。
sqlforge:
  # 配置项 security：用途：承载安全相关配置；默认值：见其子项；运行影响：影响敏感字段加密和认证安全边界。
  security:
    # 配置项 crypto：用途：配置敏感字段加密组件；默认值：见其子项；运行影响：配置错误会导致密文无法解密或写入失败。
    crypto:
      # 配置项 algorithm：用途：指定加密算法标识；默认值：AES256_GCM；运行影响：算法不匹配会导致加解密不兼容。
      algorithm: AES256_GCM
      # 配置项 key-id：用途：指定当前密钥标识；默认值：环境变量 SQLFORGE_SQL_OPTIMIZATION_DEV_CRYPTO_KEY_ID，未设置时为 sql-optimization-dev-key；运行影响：影响密文元数据和密钥轮换追溯。
      key-id: ${SQLFORGE_SQL_OPTIMIZATION_DEV_CRYPTO_KEY_ID:sql-optimization-dev-key}
      # 配置项 base64-key：用途：提供 Base64 编码的加密密钥；默认值：环境变量 SQLFORGE_SQL_OPTIMIZATION_DEV_CRYPTO_KEY_BASE64，未设置时为 空值；运行影响：为空会使加密组件无法进行真实加解密。
      base64-key: ${SQLFORGE_SQL_OPTIMIZATION_DEV_CRYPTO_KEY_BASE64:}

# 配置项 sql-optimization：用途：配置 SQL 优化服务或优化客户端；默认值：见其子项；运行影响：影响解析、推荐、改写和计划分析。
sql-optimization:
  # 配置项 callbacks：用途：配置异步回调能力；默认值：见其子项；运行影响：影响优化任务完成后是否触发回调。
  callbacks:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：false；运行影响：关闭后上级功能不会进入运行路径。
    enabled: false
  # 配置项 hetu-plan：用途：配置 Hetu 计划分析能力；默认值：见其子项；运行影响：影响是否连接 Hetu 获取 explain plan。
  hetu-plan:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_ENABLED，未设置时为 false；运行影响：关闭后上级功能不会进入运行路径。
    enabled: ${SQL_OPTIMIZATION_HETU_PLAN_ENABLED:false}
    # 配置项 query-timeout-seconds：用途：设置查询或计划分析超时秒数；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_QUERY_TIMEOUT_SECONDS，未设置时为 5；运行影响：过短会中断慢查询，过长会拖慢失败返回。
    query-timeout-seconds: ${SQL_OPTIMIZATION_HETU_PLAN_QUERY_TIMEOUT_SECONDS:5}
    # 配置项 datasources：用途：列出计划分析可用的数据源；默认值：见其子项；运行影响：缺失会导致对应数据源无法做计划分析。
    datasources:
      # 配置项 hetu_main：用途：定义计划分析数据源 hetu_main；默认值：见其子项；运行影响：连接参数缺失会导致该数据源无法执行计划分析。
      hetu_main:
        # 配置项 driver-class-name：用途：指定 JDBC 驱动类；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_DRIVER，未设置时为 空值；运行影响：驱动不匹配会导致数据库连接初始化失败。
        driver-class-name: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_DRIVER:}
        # 配置项 jdbc-url：用途：指定 JDBC 连接地址；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_JDBC_URL，未设置时为 空值；运行影响：地址错误会导致计划分析或数据库访问失败。
        jdbc-url: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_JDBC_URL:}
        # 配置项 username：用途：指定连接账号；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_USERNAME，未设置时为 空值；运行影响：账号错误会导致认证失败。
        username: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_USERNAME:}
        # 配置项 password：用途：指定连接密码或令牌；默认值：环境变量 SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_PASSWORD，未设置时为 空值；运行影响：为空或错误会导致认证失败，生产必须由环境变量注入。
        password: ${SQL_OPTIMIZATION_HETU_PLAN_HETU_MAIN_PASSWORD:}
