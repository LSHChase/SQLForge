name: Phase Gate

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Gate scope
        required: true
        default: full
        type: choice
        options:
          - entry
          - delivery
          - compliance
          - full
      coverage_phase:
        description: Coverage phase for delivery/full
        required: true
        default: phase1plus
        type: choice
        options:
          - phase0
          - phase1plus
      require_sonar:
        description: Require Sonar fallback during delivery/full
        required: true
        default: false
        type: boolean
      run_real_kafka_gate:
        description: Run real Kafka runtime gate during compliance/full
        required: true
        default: false
        type: boolean

jobs:
  phase-gate:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_PROJECT_NAME: ${{ vars.SONAR_PROJECT_NAME }}
      SONAR_QUALITY_GATE_WAIT: ${{ vars.SONAR_QUALITY_GATE_WAIT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: ${{ inputs.gate == 'delivery' || inputs.gate == 'full' }}
        run: npm install

      - name: Run phase gate
        run: |
          ARGS=(--gate "${{ inputs.gate }}" --coverage-phase "${{ inputs.coverage_phase }}")
          if [ "${{ inputs.require_sonar }}" = "true" ] && ([ "${{ inputs.gate }}" = "delivery" ] || [ "${{ inputs.gate }}" = "full" ]); then
            ARGS+=(--require-sonar)
          fi
          if [ "${{ inputs.run_real_kafka_gate }}" = "true" ] && ([ "${{ inputs.gate }}" = "compliance" ] || [ "${{ inputs.gate }}" = "full" ]); then
            ARGS+=(--run-real-kafka-gate)
          fi
          bash scripts/run-phase-gates.sh "${ARGS[@]}"
