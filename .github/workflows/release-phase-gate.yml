# 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Release Phase Gate；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
name: Release Phase Gate

# 配置项 on：用途：定义 GitHub Actions workflow 触发入口；默认值：见其子项；运行影响：触发条件变化会改变 CI 或门禁执行时机。
on:
  # 配置项 push：用途：定义代码推送触发条件；默认值：见其子项；运行影响：分支或 tag 匹配变化会影响推送后是否运行 workflow。
  push:
    # 配置项 tags：用途：列出允许触发 workflow 的 tag 模式；默认值：见其子项；运行影响：模式变化会改变哪些 tag 推送会运行发布门禁。
    tags:
      # 配置列表项 列表值：用途：把 tag 模式 'checkpoint/**' 纳入发布门禁触发范围；默认值：当前列表项为 'checkpoint/**'；运行影响：匹配该模式的 tag push 会运行发布门禁。
      - 'checkpoint/**'
  # 配置项 release：用途：定义 release 事件触发条件；默认值：见其子项；运行影响：事件类型变化会影响发布后门禁是否执行。
  release:
    # 配置项 types：用途：列出允许触发 workflow 的事件类型；默认值：见其子项；运行影响：事件类型变化会改变 release 等事件触发范围。
    types:
      # 配置列表项 列表值：用途：把事件类型 published 纳入 release 触发范围；默认值：当前列表项为 published；运行影响：匹配该类型的 release 事件会运行门禁。
      - published

# 配置项 concurrency：用途：配置 workflow 并发分组；默认值：见其子项；运行影响：分组变化会影响重复发布门禁的排队和并发控制。
concurrency:
  # 配置项 group：用途：定义并发控制分组键；默认值：release-phase-gate-${{ github.event_name }}-${{ github.ref }}；运行影响：同组 workflow 会按并发策略互相约束。
  group: release-phase-gate-${{ github.event_name }}-${{ github.ref }}
  # 配置项 cancel-in-progress：用途：控制同组新运行是否取消旧运行；默认值：false；运行影响：开启后可能终止仍在执行的发布门禁。
  cancel-in-progress: false

# 配置项 jobs：用途：定义 workflow 内的作业集合；默认值：见其子项；运行影响：作业集合变化会改变 CI 或门禁实际执行内容。
jobs:
  # 配置项 release-phase-gate：用途：定义 GitHub Actions 作业 release-phase-gate；默认值：见其子项；运行影响：该作业失败会导致对应 workflow 失败。
  release-phase-gate:
    # 配置项 runs-on：用途：指定作业运行的 GitHub runner 镜像；默认值：ubuntu-latest；运行影响：runner 变化会影响系统依赖、工具版本和执行兼容性。
    runs-on: ubuntu-latest
    # 配置项 permissions：用途：声明 workflow token 权限；默认值：见其子项；运行影响：权限过大会扩大 CI 写边界，过小会导致步骤失败。
    permissions:
      # 配置项 contents：用途：配置仓库内容读取或写入权限；默认值：read；运行影响：权限变化会影响 checkout、上传或 release 元数据访问。
      contents: read
    # 配置项 env：用途：定义作业或步骤环境变量；默认值：见其子项；运行影响：变量变化会影响脚本读取的外部配置和密钥注入。
    env:
      # 配置项 SONAR_HOST_URL：用途：向门禁脚本注入 SONAR_HOST_URL；默认值：GitHub 表达式 ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && secrets.SONAR_HOST_URL || '' }}；运行影响：值为空时 Sonar fallback 会跳过或在强制模式下失败。
      SONAR_HOST_URL: ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && secrets.SONAR_HOST_URL || '' }}
      # 配置项 SONAR_TOKEN：用途：向门禁脚本注入 SONAR_TOKEN；默认值：GitHub 表达式 ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && secrets.SONAR_TOKEN || '' }}；运行影响：值为空时 Sonar fallback 会跳过或在强制模式下失败。
      SONAR_TOKEN: ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && secrets.SONAR_TOKEN || '' }}
      # 配置项 SONAR_PROJECT_KEY：用途：向门禁脚本注入 SONAR_PROJECT_KEY；默认值：GitHub 表达式 ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && vars.SONAR_PROJECT_KEY || '' }}；运行影响：值为空时 Sonar fallback 会跳过或在强制模式下失败。
      SONAR_PROJECT_KEY: ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && vars.SONAR_PROJECT_KEY || '' }}
      # 配置项 SONAR_PROJECT_NAME：用途：向门禁脚本注入 SONAR_PROJECT_NAME；默认值：GitHub 表达式 ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && vars.SONAR_PROJECT_NAME || '' }}；运行影响：值为空时 Sonar fallback 会跳过或在强制模式下失败。
      SONAR_PROJECT_NAME: ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && vars.SONAR_PROJECT_NAME || '' }}
      # 配置项 SONAR_QUALITY_GATE_WAIT：用途：向门禁脚本注入 SONAR_QUALITY_GATE_WAIT；默认值：GitHub 表达式 ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && vars.SONAR_QUALITY_GATE_WAIT || '' }}；运行影响：值为空时 Sonar fallback 会跳过或在强制模式下失败。
      SONAR_QUALITY_GATE_WAIT: ${{ vars.SONAR_ENABLE_DEFAULT == 'true' && vars.SONAR_QUALITY_GATE_WAIT || '' }}
    # 配置项 steps：用途：定义作业内按顺序执行的步骤；默认值：见其子项；运行影响：步骤顺序或内容变化会影响门禁覆盖范围。
    steps:
      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Checkout；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Checkout
        # 配置项 uses：用途：引用复用的 GitHub Action；默认值：actions/checkout@v4；运行影响：版本变化会影响检出、环境安装或产物上传行为。
        uses: actions/checkout@v4

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Setup JDK 8u112；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Setup JDK 8u112
        # 配置项 uses：用途：引用复用的 GitHub Action；默认值：actions/setup-java@v4；运行影响：版本变化会影响检出、环境安装或产物上传行为。
        uses: actions/setup-java@v4
        # 配置项 with：用途：向当前 Action 传入参数；默认值：见其子项；运行影响：参数变化会影响该 Action 的执行方式。
        with:
          # 配置项 distribution：用途：指定 JDK 发行版；默认值：zulu；运行影响：发行版变化会影响 Java 工具链获取来源。
          distribution: zulu
          # 配置项 java-version：用途：指定 CI 使用的 JDK 8u112 版本；默认值：'8.0.112'；运行影响：版本变化会破坏仓库固定 JDK 8u112 基线。
          java-version: '8.0.112'

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Verify JDK 8u112；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Verify JDK 8u112
        # 配置项 run：用途：定义当前步骤执行的 shell 命令；默认值：多行脚本块；运行影响：命令失败会导致对应 CI 步骤失败。
        run: |
          java -version 2>&1 | tee /tmp/sqlforge-java-version.txt
          grep '1.8.0_112' /tmp/sqlforge-java-version.txt

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Setup Node.js 18.20.8；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Setup Node.js 18.20.8
        # 配置项 uses：用途：引用复用的 GitHub Action；默认值：actions/setup-node@v4；运行影响：版本变化会影响检出、环境安装或产物上传行为。
        uses: actions/setup-node@v4
        # 配置项 with：用途：向当前 Action 传入参数；默认值：见其子项；运行影响：参数变化会影响该 Action 的执行方式。
        with:
          # 配置项 node-version：用途：指定 CI 使用的 Node.js 版本；默认值：'18.20.8'；运行影响：版本变化会影响前端依赖安装和构建一致性。
          node-version: '18.20.8'

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Install frontend dependencies；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Install frontend dependencies
        # 配置项 run：用途：定义当前步骤执行的 shell 命令；默认值：npm install；运行影响：命令失败会导致对应 CI 步骤失败。
        run: npm install

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Capture release metadata；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Capture release metadata
        # 配置项 run：用途：定义当前步骤执行的 shell 命令；默认值：多行脚本块；运行影响：命令失败会导致对应 CI 步骤失败。
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event_path = Path(os.environ["GITHUB_EVENT_PATH"])
          payload = json.loads(event_path.read_text(encoding="utf-8"))
          metadata = {
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "ref": os.environ.get("GITHUB_REF", ""),
              "ref_name": os.environ.get("GITHUB_REF_NAME", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "release": {
                  "tag_name": ((payload.get("release") or {}).get("tag_name", "")),
                  "name": ((payload.get("release") or {}).get("name", "")),
                  "target_commitish": ((payload.get("release") or {}).get("target_commitish", "")),
              },
          }
          out_dir = Path("artifacts")
          out_dir.mkdir(parents=True, exist_ok=True)
          (out_dir / "release-phase-gate-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Run release phase gate；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Run release phase gate
        # 配置项 run：用途：定义当前步骤执行的 shell 命令；默认值：bash scripts/run-phase-gates.sh --gate full --coverage-phase phase1plus；运行影响：命令失败会导致对应 CI 步骤失败。
        run: bash scripts/run-phase-gates.sh --gate full --coverage-phase phase1plus

      # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：Upload release gate metadata；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
      - name: Upload release gate metadata
        # 配置项 if：用途：定义步骤执行条件表达式；默认值：GitHub 表达式 ${{ always() }}；运行影响：条件变化会影响步骤是否被跳过。
        if: ${{ always() }}
        # 配置项 uses：用途：引用复用的 GitHub Action；默认值：actions/upload-artifact@v4；运行影响：版本变化会影响检出、环境安装或产物上传行为。
        uses: actions/upload-artifact@v4
        # 配置项 with：用途：向当前 Action 传入参数；默认值：见其子项；运行影响：参数变化会影响该 Action 的执行方式。
        with:
          # 配置项 name：用途：定义 workflow、job、步骤或上传产物的显示名称；默认值：release-phase-gate-metadata；运行影响：名称会出现在 GitHub Actions 页面和产物列表中。
          name: release-phase-gate-metadata
          # 配置项 path：用途：指定产物上传或文件匹配路径；默认值：artifacts/release-phase-gate-metadata.json；运行影响：路径错误会导致产物缺失或上传失败。
          path: artifacts/release-phase-gate-metadata.json
          # 配置项 if-no-files-found：用途：指定上传路径为空时的处理策略；默认值：error；运行影响：设为 error 会让缺少产物直接失败。
          if-no-files-found: error
