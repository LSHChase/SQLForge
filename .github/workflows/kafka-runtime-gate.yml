name: Kafka Runtime Gate

on:
  workflow_dispatch:

jobs:
  kafka-runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 8u112
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8.0.112'

      - name: Verify JDK 8u112
        run: |
          java -version 2>&1 | tee /tmp/sqlforge-java-version.txt
          grep '1.8.0_112' /tmp/sqlforge-java-version.txt

      - name: Run real Kafka runtime gate
        run: bash scripts/run-kafka-runtime-gate.sh
