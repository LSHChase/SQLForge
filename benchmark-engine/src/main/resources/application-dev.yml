logging:
  level:
    root: DEBUG
    com.company.benchmarkengine: DEBUG

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_BENCHMARK_ENGINE_DEV_CRYPTO_KEY_ID:benchmark-engine-dev-key}
      base64-key: ${SQLFORGE_BENCHMARK_ENGINE_DEV_CRYPTO_KEY_BASE64:}

benchmark-engine:
  execution:
    mode: isolated-placeholder
