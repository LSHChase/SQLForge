spring:
  application:
    name: benchmark-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.benchmarkengine: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath*:mapper/*.xml

benchmark-engine:
  isolation:
    readonly-required: true
    shadow-environment-default: REQUIRED
    desensitization-default: REQUIRED
  task-model:
    contract-stage: LONG_TERM_BASELINE
    implementation-stage: EXTERNALIZED_ARTIFACT_GOVERNANCE_TRACE_BASELINE
  task-execution:
    poll-interval-ms: 25
    queue-visibility-delay-ms: 100
    phase-delay-ms: 40
    isolation-sample-count: 8
    isolation-work-iterations: 96
  queues:
    mode: database-worker
  governance:
    base-url: ${BENCHMARK_ENGINE_GOVERNANCE_BASE_URL:http://localhost:8080/api/governance/internal}
    connect-timeout-ms: ${BENCHMARK_ENGINE_GOVERNANCE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${BENCHMARK_ENGINE_GOVERNANCE_READ_TIMEOUT_MS:5000}
    datasource-id-map:
      AUTO: ${BENCHMARK_ENGINE_GOVERNANCE_DATASOURCE_AUTO:benchmark-hetu}
      HETU: ${BENCHMARK_ENGINE_GOVERNANCE_DATASOURCE_HETU:benchmark-hetu}
      HIVE: ${BENCHMARK_ENGINE_GOVERNANCE_DATASOURCE_HIVE:benchmark-hive}
  artifact-storage:
    base-dir: ${BENCHMARK_ENGINE_ARTIFACT_STORAGE_BASE_DIR:target/benchmark-engine-artifacts}
    storage-type: ${BENCHMARK_ENGINE_ARTIFACT_STORAGE_TYPE:LOCAL_FILE}
    recovery-enabled: ${BENCHMARK_ENGINE_ARTIFACT_STORAGE_RECOVERY_ENABLED:true}
    cleanup-stale-files: ${BENCHMARK_ENGINE_ARTIFACT_STORAGE_CLEANUP_STALE_FILES:true}

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_BENCHMARK_ENGINE_CRYPTO_KEY_ID:benchmark-engine-dev-key}
      base64-key: ${SQLFORGE_BENCHMARK_ENGINE_CRYPTO_KEY_BASE64:}
