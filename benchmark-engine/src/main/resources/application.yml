spring:
  application:
    name: benchmark-engine
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.benchmarkengine: INFO

benchmark-engine:
  isolation:
    readonly-required: true
    shadow-environment-default: REQUIRED
    desensitization-default: REQUIRED
  task-model:
    contract-stage: LONG_TERM_BASELINE
    implementation-stage: ASYNC_TASK_API_SKELETON
  task-execution:
    poll-interval-ms: 25
    queue-visibility-delay-ms: 100
    phase-delay-ms: 40

auth:
  enabled: false
  trusted-auth-sources:
    - header

sqlforge:
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_BENCHMARK_ENGINE_CRYPTO_KEY_ID:benchmark-engine-dev-key}
      base64-key: ${SQLFORGE_BENCHMARK_ENGINE_CRYPTO_KEY_BASE64:}
