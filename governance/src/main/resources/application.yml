spring:
  application:
    name: governance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${GOVERNANCE_DATASOURCE_DRIVER_MAX_FILE_SIZE:50MB}
      max-request-size: ${GOVERNANCE_DATASOURCE_DRIVER_MAX_REQUEST_SIZE:52MB}

server:
  port: 8080
  tomcat:
    max-swallow-size: ${GOVERNANCE_TOMCAT_MAX_SWALLOW_SIZE:-1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.governance: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath*:mapper/*.xml

auth:
  enabled: false
  trusted-auth-sources:
    - header

governance:
  benchmark-engine:
    base-url: ${GOVERNANCE_BENCHMARK_ENGINE_BASE_URL:http://localhost:8083/api/benchmark-engine/internal}
    connect-timeout-ms: ${GOVERNANCE_BENCHMARK_ENGINE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GOVERNANCE_BENCHMARK_ENGINE_READ_TIMEOUT_MS:5000}
  sql-optimization:
    base-url: ${GOVERNANCE_SQL_OPTIMIZATION_BASE_URL:http://localhost:8082/api/sql-optimization}
    connect-timeout-ms: ${GOVERNANCE_SQL_OPTIMIZATION_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GOVERNANCE_SQL_OPTIMIZATION_READ_TIMEOUT_MS:5000}
  access-control:
    enabled: true
    deny-by-default: true
    audit-decisions: true
    datasource-scopes:
      tenant-a:
        query-trino:
          state: ACTIVE
          actions:
            - USE
        query-hetu:
          state: ACTIVE
          actions:
            - USE
        query-hive:
          state: ACTIVE
          actions:
            - USE
        optimization-hetu:
          state: ACTIVE
          actions:
            - USE
        optimization-hive:
          state: ACTIVE
          actions:
            - USE
        benchmark-hetu:
          state: ACTIVE
          actions:
            - USE
            - EXPORT
        benchmark-hive:
          state: ACTIVE
          actions:
            - USE
            - EXPORT
        governance-tenant-config:
          state: ACTIVE
          actions:
            - READ
            - MANAGE
      system:
        governance-tenant-config:
          state: ACTIVE
          actions:
            - READ
            - MANAGE
  datasource-driver:
    max-file-size: ${GOVERNANCE_DATASOURCE_DRIVER_MAX_FILE_SIZE:50MB}
