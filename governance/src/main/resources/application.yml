spring:
  application:
    name: governance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.governance: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath*:mapper/*.xml

auth:
  enabled: false
  trusted-auth-sources:
    - header

governance:
  benchmark-engine:
    base-url: ${GOVERNANCE_BENCHMARK_ENGINE_BASE_URL:http://localhost:8083/api/benchmark-engine/internal}
    connect-timeout-ms: ${GOVERNANCE_BENCHMARK_ENGINE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GOVERNANCE_BENCHMARK_ENGINE_READ_TIMEOUT_MS:5000}
  sql-optimization:
    base-url: ${GOVERNANCE_SQL_OPTIMIZATION_BASE_URL:http://localhost:8082/api/sql-optimization}
    connect-timeout-ms: ${GOVERNANCE_SQL_OPTIMIZATION_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${GOVERNANCE_SQL_OPTIMIZATION_READ_TIMEOUT_MS:5000}
  access-control:
    enabled: true
    deny-by-default: true
    audit-decisions: true
    role-matrix:
      PLATFORM_ADMIN:
        permissions:
          - "*"
      TENANT_ADMIN:
        permissions:
          - query.execute
          - optimization.submit
          - optimization.status.read
          - benchmark.submit
          - benchmark.status.read
          - benchmark.report.read
          - governance.tenant-config.read
          - governance.history.read
          - governance.permission.manage
      OPERATOR:
        permissions:
          - query.execute
          - optimization.submit
          - optimization.status.read
          - benchmark.submit
          - benchmark.status.read
          - benchmark.report.read
          - governance.history.read
      ANALYST:
        permissions:
          - query.execute
          - optimization.submit
          - optimization.status.read
      AUDITOR:
        permissions:
          - governance.history.read
      READONLY:
        permissions:
          - optimization.status.read
          - benchmark.status.read
          - benchmark.report.read
    resource-model:
      QUERY_EXECUTION_QUERY:
        operations:
          QUERY_EXECUTE_SYNC:
            required-permissions:
              - query.execute
            datasource-action: USE
      SQL_OPTIMIZATION_TASK:
        operations:
          OPTIMIZATION_TASK_SUBMIT:
            required-permissions:
              - optimization.submit
            datasource-action: USE
          OPTIMIZATION_TASK_STATUS_QUERY:
            required-permissions:
              - optimization.status.read
            datasource-action: USE
      BENCHMARK_ENGINE_TASK:
        operations:
          BENCHMARK_TASK_SUBMIT:
            required-permissions:
              - benchmark.submit
            datasource-action: USE
          BENCHMARK_TASK_STATUS_QUERY:
            required-permissions:
              - benchmark.status.read
            datasource-action: USE
      BENCHMARK_ENGINE_REPORT:
        operations:
          BENCHMARK_REPORT_QUERY:
            required-permissions:
              - benchmark.report.read
            datasource-action: EXPORT
      GOVERNANCE_TENANT_CONFIG:
        operations:
          TENANT_CONFIG_READ:
            required-permissions:
              - governance.tenant-config.read
            datasource-action: READ
      GOVERNANCE_HISTORY:
        operations:
          HISTORY_READ:
            required-permissions:
              - governance.history.read
            datasource-action: READ
      DATASOURCE_AUTHORIZATION_MATRIX:
        operations:
          PERMISSION_CHANGE:
            required-permissions:
              - governance.permission.manage
    datasource-authorization-matrix:
      tenant-a:
        query-hetu:
          state: ACTIVE
          actions:
            - USE
        query-hive:
          state: ACTIVE
          actions:
            - USE
        optimization-hetu:
          state: ACTIVE
          actions:
            - USE
        optimization-hive:
          state: ACTIVE
          actions:
            - USE
        benchmark-hetu:
          state: ACTIVE
          actions:
            - USE
            - EXPORT
        benchmark-hive:
          state: ACTIVE
          actions:
            - USE
            - EXPORT
        governance-tenant-config:
          state: ACTIVE
          actions:
            - READ
            - MANAGE
      system:
        governance-tenant-config:
          state: ACTIVE
          actions:
            - READ
            - MANAGE
