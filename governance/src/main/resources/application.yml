# 配置项 spring：说明该配置的用途、默认值或运行影响。
spring:
  # 配置项 application：说明该配置的用途、默认值或运行影响。
  application:
    # 配置项 name：说明该配置的用途、默认值或运行影响。
    name: governance
  # 配置项 profiles：说明该配置的用途、默认值或运行影响。
  profiles:
    # 配置项 active：说明该配置的用途、默认值或运行影响。
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 配置项 servlet：说明该配置的用途、默认值或运行影响。
  servlet:
    # 配置项 multipart：说明该配置的用途、默认值或运行影响。
    multipart:
      # 配置项 max-file-size：说明该配置的用途、默认值或运行影响。
      max-file-size: ${GOVERNANCE_DATASOURCE_DRIVER_MAX_FILE_SIZE:50MB}
      # 配置项 max-request-size：说明该配置的用途、默认值或运行影响。
      max-request-size: ${GOVERNANCE_DATASOURCE_DRIVER_MAX_REQUEST_SIZE:52MB}

# 配置项 server：说明该配置的用途、默认值或运行影响。
server:
  # 配置项 port：说明该配置的用途、默认值或运行影响。
  port: 8080
  # 配置项 tomcat：说明该配置的用途、默认值或运行影响。
  tomcat:
    # 配置项 max-swallow-size：说明该配置的用途、默认值或运行影响。
    max-swallow-size: ${GOVERNANCE_TOMCAT_MAX_SWALLOW_SIZE:-1}

# 配置项 management：说明该配置的用途、默认值或运行影响。
management:
  # 配置项 endpoints：说明该配置的用途、默认值或运行影响。
  endpoints:
    # 配置项 web：说明该配置的用途、默认值或运行影响。
    web:
      # 配置项 exposure：说明该配置的用途、默认值或运行影响。
      exposure:
        # 配置项 include：说明该配置的用途、默认值或运行影响。
        include: health,info,metrics,prometheus
  # 配置项 endpoint：说明该配置的用途、默认值或运行影响。
  endpoint:
    # 配置项 health：说明该配置的用途、默认值或运行影响。
    health:
      # 配置项 show-details：说明该配置的用途、默认值或运行影响。
      show-details: always

# 配置项 logging：说明该配置的用途、默认值或运行影响。
logging:
  # 配置项 level：说明该配置的用途、默认值或运行影响。
  level:
    # 配置项 root：说明该配置的用途、默认值或运行影响。
    root: INFO
    # 配置项 com.company.governance：说明该配置的用途、默认值或运行影响。
    com.company.governance: INFO

# 配置项 mybatis：说明该配置的用途、默认值或运行影响。
mybatis:
  # 配置项 config-location：说明该配置的用途、默认值或运行影响。
  config-location: classpath:mybatis-config.xml
  # 配置项 mapper-locations：说明该配置的用途、默认值或运行影响。
  mapper-locations: classpath*:mapper/*.xml

# 配置项 auth：说明该配置的用途、默认值或运行影响。
auth:
  # 配置项 enabled：说明该配置的用途、默认值或运行影响。
  enabled: false
  # 配置项 trusted-auth-sources：说明该配置的用途、默认值或运行影响。
  trusted-auth-sources:
    # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
    - header

# 配置项 governance：说明该配置的用途、默认值或运行影响。
governance:
  # 配置项 benchmark-engine：说明该配置的用途、默认值或运行影响。
  benchmark-engine:
    # 配置项 base-url：说明该配置的用途、默认值或运行影响。
    base-url: ${GOVERNANCE_BENCHMARK_ENGINE_BASE_URL:http://localhost:8083/api/benchmark-engine/internal}
    # 配置项 connect-timeout-ms：说明该配置的用途、默认值或运行影响。
    connect-timeout-ms: ${GOVERNANCE_BENCHMARK_ENGINE_CONNECT_TIMEOUT_MS:3000}
    # 配置项 read-timeout-ms：说明该配置的用途、默认值或运行影响。
    read-timeout-ms: ${GOVERNANCE_BENCHMARK_ENGINE_READ_TIMEOUT_MS:5000}
  # 配置项 sql-optimization：说明该配置的用途、默认值或运行影响。
  sql-optimization:
    # 配置项 base-url：说明该配置的用途、默认值或运行影响。
    base-url: ${GOVERNANCE_SQL_OPTIMIZATION_BASE_URL:http://localhost:8082/api/sql-optimization}
    # 配置项 connect-timeout-ms：说明该配置的用途、默认值或运行影响。
    connect-timeout-ms: ${GOVERNANCE_SQL_OPTIMIZATION_CONNECT_TIMEOUT_MS:3000}
    # 配置项 read-timeout-ms：说明该配置的用途、默认值或运行影响。
    read-timeout-ms: ${GOVERNANCE_SQL_OPTIMIZATION_READ_TIMEOUT_MS:5000}
  # 配置项 access-control：说明该配置的用途、默认值或运行影响。
  access-control:
    # 配置项 enabled：说明该配置的用途、默认值或运行影响。
    enabled: true
    # 配置项 deny-by-default：说明该配置的用途、默认值或运行影响。
    deny-by-default: true
    # 配置项 audit-decisions：说明该配置的用途、默认值或运行影响。
    audit-decisions: true
    # 配置项 datasource-scopes：说明该配置的用途、默认值或运行影响。
    datasource-scopes:
      # 配置项 tenant-a：说明该配置的用途、默认值或运行影响。
      tenant-a:
        # 配置项 query-trino：说明该配置的用途、默认值或运行影响。
        query-trino:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
        # 配置项 query-hetu：说明该配置的用途、默认值或运行影响。
        query-hetu:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
        # 配置项 query-hive：说明该配置的用途、默认值或运行影响。
        query-hive:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
        # 配置项 optimization-hetu：说明该配置的用途、默认值或运行影响。
        optimization-hetu:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
        # 配置项 optimization-hive：说明该配置的用途、默认值或运行影响。
        optimization-hive:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
        # 配置项 benchmark-hetu：说明该配置的用途、默认值或运行影响。
        benchmark-hetu:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - EXPORT
        # 配置项 benchmark-hive：说明该配置的用途、默认值或运行影响。
        benchmark-hive:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - USE
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - EXPORT
        # 配置项 governance-tenant-config：说明该配置的用途、默认值或运行影响。
        governance-tenant-config:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - READ
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - MANAGE
      # 配置项 system：说明该配置的用途、默认值或运行影响。
      system:
        # 配置项 governance-tenant-config：说明该配置的用途、默认值或运行影响。
        governance-tenant-config:
          # 配置项 state：说明该配置的用途、默认值或运行影响。
          state: ACTIVE
          # 配置项 actions：说明该配置的用途、默认值或运行影响。
          actions:
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - READ
            # 配置列表项 列表值：说明该配置的用途、默认值或运行影响。
            - MANAGE
  # 配置项 datasource-driver：说明该配置的用途、默认值或运行影响。
  datasource-driver:
    # 配置项 max-file-size：说明该配置的用途、默认值或运行影响。
    max-file-size: ${GOVERNANCE_DATASOURCE_DRIVER_MAX_FILE_SIZE:50MB}
