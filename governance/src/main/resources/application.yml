spring:
  application:
    name: governance
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.company.governance: INFO

mybatis:
  config-location: classpath:mybatis-config.xml
  mapper-locations: classpath*:mapper/*.xml

auth:
  enabled: false
  trusted-auth-sources:
    - header

governance:
  access-control:
    placeholder:
      enabled: true
      deny-by-default: true
      governance-datasource-ids:
        - governance-tenant-config
      tenant-config-allowed-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
      datasource-use-allowed-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
        - OPERATOR
        - ANALYST
