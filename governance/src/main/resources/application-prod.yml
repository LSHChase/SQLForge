# 配置项 spring：用途：承载 Spring 应用基础配置；默认值：见其子项；运行影响：影响应用名称、激活环境、数据源和自动装配。
spring:
  # 配置项 datasource：用途：配置服务数据库连接；默认值：见其子项；运行影响：影响持久化、查询和任务状态读写。
  datasource:
    # 配置项 driver-class-name：用途：指定 JDBC 驱动类；默认值：com.mysql.cj.jdbc.Driver；运行影响：驱动不匹配会导致数据库连接初始化失败。
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 配置项 url：用途：指定数据库或服务访问地址；默认值：环境变量 SQLFORGE_PROD_DB_URL，未设置时为 jdbc:mysql://tdsql-prod:3306/sqlforge?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false；运行影响：地址错误或时区参数缺失会导致生产时间读写口径漂移。
    url: ${SQLFORGE_PROD_DB_URL:jdbc:mysql://tdsql-prod:3306/sqlforge?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false}
    # 配置项 username：用途：指定连接账号；默认值：环境变量 SQLFORGE_PROD_DB_USER，未设置时为 sqlforge；运行影响：账号错误会导致认证失败。
    username: ${SQLFORGE_PROD_DB_USER:sqlforge}
    # 配置项 password：用途：指定连接密码或令牌；默认值：环境变量 SQLFORGE_PROD_DB_PASSWORD，未设置时为 空值；运行影响：为空或错误会导致认证失败，生产必须由环境变量注入。
    password: ${SQLFORGE_PROD_DB_PASSWORD:}
  # 配置项 redis：用途：配置 Redis 连接或 Redis 支撑能力；默认值：见其子项；运行影响：影响缓存、队列或临时状态能力是否可用。
  redis:
    # 配置项 cluster：用途：配置集群连接信息；默认值：见其子项；运行影响：节点配置错误会导致集群客户端不可用。
    cluster:
      # 配置项 nodes：用途：列出集群节点地址；默认值：环境变量 SQLFORGE_PROD_REDIS_NODES，未设置时为 redis-prod-1:6379,redis-prod-2:6379,redis-prod-3:6379；运行影响：节点缺失或错误会影响高可用连接。
      nodes: ${SQLFORGE_PROD_REDIS_NODES:redis-prod-1:6379,redis-prod-2:6379,redis-prod-3:6379}

# R-144：生产环境使用真实Kafka。
# 配置项 messaging：用途：定义顶层配置段 messaging；默认值：见其子项；运行影响：该段缺失会导致对应服务配置无法绑定。
messaging:
  mode: KAFKA # 配置项 mode：用途：选择治理消息模块运行模式；默认值：KAFKA；运行影响：生产环境使用真实 Kafka，配置错误会阻断消息发布和消费。
  # 配置项 kafka：用途：配置 Kafka 消息通道；默认值：见其子项；运行影响：影响消息发布、消费和生产模式接入。
  kafka:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：true；运行影响：关闭后上级功能不会进入运行路径。
    enabled: true
    # 配置项 bootstrap-servers：用途：指定 Kafka bootstrap server 列表；默认值：环境变量 SQLFORGE_PROD_KAFKA_BOOTSTRAP，未设置时为 kafka-prod-1:9092,kafka-prod-2:9092,kafka-prod-3:9092；运行影响：地址错误会导致 Kafka 客户端无法连接。
    bootstrap-servers: ${SQLFORGE_PROD_KAFKA_BOOTSTRAP:kafka-prod-1:9092,kafka-prod-2:9092,kafka-prod-3:9092}
    # 配置项 security-protocol：用途：指定 Kafka 安全协议；默认值：环境变量 SQLFORGE_PROD_KAFKA_SECURITY_PROTOCOL，未设置时为 PLAINTEXT；运行影响：协议不匹配会导致 Kafka 握手失败。
    security-protocol: ${SQLFORGE_PROD_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    # 配置项 sasl-mechanism：用途：指定 Kafka SASL 机制；默认值：环境变量 SQLFORGE_PROD_KAFKA_SASL_MECHANISM，未设置时为 空值；运行影响：机制错误会导致认证失败。
    sasl-mechanism: ${SQLFORGE_PROD_KAFKA_SASL_MECHANISM:}
    # 配置项 sasl-jaas-config：用途：指定 Kafka SASL JAAS 配置；默认值：环境变量 SQLFORGE_PROD_KAFKA_SASL_JAAS_CONFIG，未设置时为 空值；运行影响：配置错误会导致认证失败且可能泄露敏感信息。
    sasl-jaas-config: ${SQLFORGE_PROD_KAFKA_SASL_JAAS_CONFIG:}
    # 配置项 ssl-truststore-location：用途：指定 Kafka SSL truststore 路径；默认值：环境变量 SQLFORGE_PROD_KAFKA_SSL_TRUSTSTORE_LOCATION，未设置时为 空值；运行影响：路径错误会导致 TLS 校验失败。
    ssl-truststore-location: ${SQLFORGE_PROD_KAFKA_SSL_TRUSTSTORE_LOCATION:}
    # 配置项 ssl-truststore-password：用途：指定 Kafka SSL truststore 密码；默认值：环境变量 SQLFORGE_PROD_KAFKA_SSL_TRUSTSTORE_PASSWORD，未设置时为 空值；运行影响：密码错误会导致 TLS 初始化失败。
    ssl-truststore-password: ${SQLFORGE_PROD_KAFKA_SSL_TRUSTSTORE_PASSWORD:}
    # 配置项 producer：用途：配置 Kafka producer 参数；默认值：见其子项；运行影响：影响消息发送可靠性和超时行为。
    producer:
      # 配置项 acks：用途：设置 Kafka producer 确认级别；默认值：all；运行影响：级别越高可靠性越强但延迟更高。
      acks: all
      # 配置项 retries：用途：设置 Kafka producer 发送重试次数；默认值：3；运行影响：次数过低会更快失败，次数过高会延迟故障暴露。
      retries: 3
      # 配置项 request-timeout-ms：用途：设置请求等待 broker 响应的超时；默认值：环境变量 SQLFORGE_PROD_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS，未设置时为 15000；运行影响：过短会增加发送失败，过长会拖慢故障返回。
      request-timeout-ms: ${SQLFORGE_PROD_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:15000}
      # 配置项 delivery-timeout-ms：用途：设置 producer 端到端投递超时；默认值：环境变量 SQLFORGE_PROD_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS，未设置时为 30000；运行影响：超过该值会判定消息投递失败。
      delivery-timeout-ms: ${SQLFORGE_PROD_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:30000}
      # 配置项 max-block-ms：用途：设置 producer 获取元数据或缓冲区最大阻塞时间；默认值：环境变量 SQLFORGE_PROD_KAFKA_PRODUCER_MAX_BLOCK_MS，未设置时为 15000；运行影响：过短会增加瞬时不可用失败。
      max-block-ms: ${SQLFORGE_PROD_KAFKA_PRODUCER_MAX_BLOCK_MS:15000}
    # 配置项 consumer：用途：配置 Kafka consumer 参数；默认值：见其子项；运行影响：影响消息消费分组和起始位点。
    consumer:
      # 配置项 group-id：用途：指定 Kafka consumer group；默认值：环境变量 SQLFORGE_PROD_KAFKA_GROUP_ID，未设置时为 sqlforge-group；运行影响：变化会影响消费位点和消息分摊。
      group-id: ${SQLFORGE_PROD_KAFKA_GROUP_ID:sqlforge-group}
      # 配置项 auto-offset-reset：用途：指定无位点时的消费起点；默认值：earliest；运行影响：earliest 会从最早消息开始消费。
      auto-offset-reset: earliest
  # 配置项 database：用途：配置数据库模式或数据库索引；默认值：见其子项；运行影响：影响数据库连接、消息兜底或缓存分区。
  database:
    # 配置项 enabled：用途：控制上级功能是否启用；默认值：false；运行影响：关闭后上级功能不会进入运行路径。
    enabled: false

# 配置项 logging：用途：配置日志输出和级别；默认值：见其子项；运行影响：影响排障信息量、日志体积和生产可观测性。
logging:
  # 配置项 level：用途：配置日志级别集合；默认值：见其子项；运行影响：影响各包日志输出粒度。
  level:
    # 配置项 root：用途：配置根日志级别；默认值：INFO；运行影响：影响未单独指定包名的日志输出。
    root: INFO
    # 配置项 com.company.governance：用途：设置 com.company.governance 包日志级别；默认值：INFO；运行影响：级别越低该包日志越详细且日志量越大。
    com.company.governance: INFO
  # 配置项 config：用途：指定日志配置文件位置；默认值：classpath:logback-spring.xml；运行影响：路径错误会导致日志配置回退或启动失败。
  config: classpath:logback-spring.xml

# 配置项 sqlforge：用途：承载 SQLForge 公共配置；默认值：见其子项；运行影响：影响安全、存储和治理公共能力。
sqlforge:
  # 配置项 security：用途：承载安全相关配置；默认值：见其子项；运行影响：影响敏感字段加密和认证安全边界。
  security:
    # 配置项 crypto：用途：配置敏感字段加密组件；默认值：见其子项；运行影响：配置错误会导致密文无法解密或写入失败。
    crypto:
      # 配置项 algorithm：用途：指定加密算法标识；默认值：AES256_GCM；运行影响：算法不匹配会导致加解密不兼容。
      algorithm: AES256_GCM
      # 配置项 key-id：用途：指定当前密钥标识；默认值：环境变量 SQLFORGE_PROD_CRYPTO_KEY_ID，未设置时为 governance-prod-key；运行影响：影响密文元数据和密钥轮换追溯。
      key-id: ${SQLFORGE_PROD_CRYPTO_KEY_ID:governance-prod-key}
      # 配置项 base64-key：用途：提供 Base64 编码的加密密钥；默认值：环境变量 SQLFORGE_PROD_CRYPTO_KEY_BASE64，未设置时为 空值；运行影响：为空会使加密组件无法进行真实加解密。
      base64-key: ${SQLFORGE_PROD_CRYPTO_KEY_BASE64:}
  # 配置项 storage：用途：配置存储相关元数据；默认值：见其子项；运行影响：影响治理侧对存储环境的标识。
  storage:
    # 配置项 metadata：用途：记录存储或运行元数据标识；默认值：TDSQL_OR_GAUSSDB；运行影响：影响文档和运行证据对目标环境的说明。
    metadata: TDSQL_OR_GAUSSDB
  # 配置项 logging：用途：配置日志输出和级别；默认值：见其子项；运行影响：影响排障信息量、日志体积和生产可观测性。
  logging:
    # 配置项 format：用途：指定输出格式；默认值：JSON；运行影响：影响生产日志或存储元数据的结构化方式。
    format: JSON

# 配置项 auth：用途：配置请求鉴权开关和可信来源；默认值：见其子项；运行影响：影响受保护接口是否校验身份上下文。
auth:
  # 配置项 enabled：用途：控制上级功能是否启用；默认值：true；运行影响：关闭后上级功能不会进入运行路径。
  enabled: true
  # 配置项 trusted-auth-sources：用途：列出允许透传身份的来源；默认值：见其子项；运行影响：来源不匹配会导致请求被拒绝或测试假设失效。
  trusted-auth-sources:
    # 配置列表项 列表值：用途：允许身份来源 gateway；默认值：当前列表项为 gateway；运行影响：请求来源不在列表中会被鉴权拦截。
    - gateway
    # 配置列表项 列表值：用途：允许身份来源 token；默认值：当前列表项为 token；运行影响：请求来源不在列表中会被鉴权拦截。
    - token
