spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SQLFORGE_DEV_DB_URL:jdbc:mysql://localhost:3306/sqlforge?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SQLFORGE_DEV_DB_USER:sqlforge}
    password: ${SQLFORGE_DEV_DB_PASSWORD:sqlforge}
  redis:
    host: ${SQLFORGE_DEV_REDIS_HOST:localhost}
    port: ${SQLFORGE_DEV_REDIS_PORT:6379}
    password: ${SQLFORGE_DEV_REDIS_PASSWORD:}

# 生产环境要求：useSSL=true，auth.enabled=true（R-115/R-111）
# 生产环境切换为messaging.mode=KAFKA（R-144）。
messaging:
  mode: DATABASE
  kafka:
    enabled: false
    # bootstrap-servers: ${SQLFORGE_DEV_KAFKA_BOOTSTRAP:localhost:9092}
    # security-protocol: ${SQLFORGE_DEV_KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
    # sasl-mechanism: ${SQLFORGE_DEV_KAFKA_SASL_MECHANISM:}
    # sasl-jaas-config: ${SQLFORGE_DEV_KAFKA_SASL_JAAS_CONFIG:}
    # ssl-truststore-location: ${SQLFORGE_DEV_KAFKA_SSL_TRUSTSTORE_LOCATION:}
    # ssl-truststore-password: ${SQLFORGE_DEV_KAFKA_SSL_TRUSTSTORE_PASSWORD:}
  database:
    enabled: true
    poll-interval: 5000
    max-retry: 3

logging:
  level:
    root: INFO
    com.company.governance: INFO
    org.mybatis: INFO

sqlforge:
  optional:
    h2-enabled: false
  security:
    crypto:
      algorithm: AES256_GCM
      key-id: ${SQLFORGE_DEV_CRYPTO_KEY_ID:governance-dev-key}
      base64-key: ${SQLFORGE_DEV_CRYPTO_KEY_BASE64:}
  obs:
    endpoint: ${SQLFORGE_DEV_OBS_ENDPOINT:http://localhost:9000}
    access-key: ${SQLFORGE_DEV_OBS_ACCESS_KEY:minioadmin}
    secret-key: ${SQLFORGE_DEV_OBS_SECRET_KEY:minioadmin}
    bucket: ${SQLFORGE_DEV_OBS_BUCKET:sqlforge-dev}

governance:
  audit:
    smoke-force-primary-delivery-failure-enabled: ${SQLFORGE_GOVERNANCE_SMOKE_FORCE_AUDIT_DELIVERY_FAILURE:false}
    smoke-force-trace-prefix: ${SQLFORGE_GOVERNANCE_SMOKE_FORCE_TRACE_PREFIX:SMOKE-FORCE-AUDIT-FALLBACK}

auth:
  enabled: false
  trusted-auth-sources:
    - header
